[project]
site_name = "gliner"
site_description = "GLiNER bi-encoder inference service in Rust: zero-shot named entities over HTTP, CPU-first, on ONNX Runtime."
site_url = "https://damvolkov.github.io/gliner/"
site_dir = "data/ops/site"
repo_url = "https://github.com/damvolkov/gliner"
repo_name = "damvolkov/gliner"
edit_uri = "edit/main/docs/"
copyright = "MIT · gliner"
nav = [
  { "Overview" = "index.md" },
  { "API" = "api.md" },
  { "Configuration" = "configuration.md" },
  { "Model" = "model.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
