##### CI #####
# Same gate as the local prek hooks, the coverage gate (model-free, so it runs here), and the runtime image build;
# the train image (PyTorch, 2.4 GB) too once TRAIN_IMAGE is on.
# Logs are kept as an artifact: maintenance.yml hands them to the repair agent on renovate/* branches.
# Model-backed parity needs an exported model and runs locally (make backends).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: hooks (fmt, clippy, bounds, tests, licenses, ruff, zizmor, gitleaks) + coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> data/ops/target"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about,cargo-llvm-cov
      - name: pinned toolchain
        run: make toolchain
      - name: prek, then coverage (logged for the maintenance agent)
        run: |
          set -o pipefail
          mkdir -p ci-logs
          { make hooks && make coverage; } 2>&1 | tee ci-logs/build-test.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-logs
          path: ci-logs/

  image:
    name: runtime image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: gliner:ci

  train-image:
    name: train image
    if: vars.TRAIN_IMAGE == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.train
          push: false
          tags: gliner-train:ci
