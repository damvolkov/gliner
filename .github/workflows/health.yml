##### HEALTH #####
# Monthly, deterministic: are the direct dependencies (Cargo.toml's crates, the tools' Python packages) still alive
# (tools/health.py)? Opens (or refreshes) one issue labelled deps-health; closes it once everything is healthy again.
name: health

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: dependency health
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: probe registries and repositories
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          uv run --no-project python -m tools.health --output report.md --token "$GH_TOKEN"
          STATUS=$?
          set -e
          [ "$STATUS" -eq 0 ] || [ "$STATUS" -eq 3 ] || exit "$STATUS"
          echo "findings=$([ "$STATUS" -eq 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: open, refresh or close the health issue
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.probe.outputs.findings }}
        run: |
          ISSUE=$(gh issue list --label deps-health --state open --json number -q '.[0].number')
          {
            echo "Monthly dependency health check (\`tools/health.py\`): archived repositories, vanished packages,"
            echo "releases older than 18 months, repositories without a push in 12 months."
            echo
            cat report.md
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > body.md
          case "$FINDINGS:${ISSUE:+open}" in
            true:open) gh issue edit "$ISSUE" --body-file body.md ;;
            true:)     gh issue create --title "Dependency health: findings" --label deps-health --body-file body.md ;;
            false:open) gh issue close "$ISSUE" --comment "All dependencies healthy again." ;;
            *) echo "All dependencies healthy." ;;
          esac
